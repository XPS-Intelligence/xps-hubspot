name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Write permissions required for auto-merge
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # Run the full test suite (unit + integration) twice – both passes must be
  # 100% green before the build and auto-merge steps proceed.
  test:
    name: Tests – Pass ${{ matrix.pass }} of 2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pass: [1, 2]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Log test run start
        run: echo "::notice ::Starting test pass ${{ matrix.pass }} of 2"

      - name: Run all tests with coverage (pass ${{ matrix.pass }})
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Verify 100% pass – fail if any test failed
        run: |
          echo "::notice ::Test pass ${{ matrix.pass }} completed – all tests passed (100%)"

      - name: Upload coverage report (pass ${{ matrix.pass }})
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-pass-${{ matrix.pass }}
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # Auto-merge the PR after both test passes and the build succeed.
  # Only runs on pull_request events targeting main.
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    needs: [build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main'
    steps:
      # Fail immediately with a clear message if the PR is still a draft.
      # Auto-merge requires the PR to be "Ready for review"; attempting it on
      # a draft raises a GraphQL error and wastes CI time.
      - name: Ensure Pull Request Is Not Draft
        if: github.event.pull_request.draft == true
        run: |
          echo "❌ Cannot auto-merge draft pull requests. Please mark as 'Ready for review'."
          exit 1

      - name: Log auto-merge start
        run: echo "::notice ::All CI checks passed (2/2 test passes). Enabling auto-merge."

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto \
            --squash
