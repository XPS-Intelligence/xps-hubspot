# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code

# ─── API Server ───────────────────────────────────────────────────────────────
[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30

[[services]]
name = "xps-hubspot-api"

  [services.build]
  buildCommand = "npm ci && npm run build"

  [services.deploy]
  startCommand = "npm start"
  healthcheckPath = "/api/v1/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"

  [[services.envs]]
  name = "PORT"
  value = "${{PORT}}"

  [[services.envs]]
  name = "NODE_ENV"
  value = "production"

# ─── Background Worker ────────────────────────────────────────────────────────
[[services]]
name = "xps-hubspot-worker"

  [services.build]
  buildCommand = "npm ci && npm run build"

  [services.deploy]
  startCommand = "npm run worker"
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

  [[services.envs]]
  name = "NODE_ENV"
  value = "production"
